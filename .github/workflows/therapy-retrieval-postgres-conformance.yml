name: Therapy Retrieval PostgreSQL Conformance

on:
  push:
    branches:
      - "db-step7d-*"
      - "db-step7e-*"
      - "db-step7f-*"
      - "db-step7g-*"
    paths:
      - ".github/workflows/therapy-retrieval-postgres-conformance.yml"
      - "package.json"
      - "package-lock.json"
      - "src/test/therapy-retrieval-v2-preflight.test.ts"
      - "scripts/verify-therapy-retrieval-postgres-concurrency.mjs"
      - "scripts/verify-therapy-retrieval-postgres-failure-isolation.mjs"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - ".github/workflows/therapy-retrieval-postgres-conformance.yml"
      - "package.json"
      - "package-lock.json"
      - "src/test/therapy-retrieval-v2-preflight.test.ts"
      - "scripts/verify-therapy-retrieval-postgres-concurrency.mjs"
      - "scripts/verify-therapy-retrieval-postgres-failure-isolation.mjs"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: therapy-retrieval-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-17:
    name: PostgreSQL 17 / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: group-1-input-resolution
            pattern: "adds only four|binds only terminal|returns one deterministic|distinguishes malformed|fails closed after trigger-bypassed input|adds only three closed entity|derives a bounded|resolves exact channels|fails closed for invalid limits|rejects an oversized"
          - name: group-2-split-safety
            pattern: "adds only three closed split-track|binds each source-native|keeps general references|preserves an empty homeopathic|fails closed for request drift|adds only three closed safety|binds red flags|evaluates release-closed|turns every active|requires review for an unclear|requires review for an uncertain|requires review when the medication|requires review for unresolved|rejects release-external|rejects cherry-picked"
          - name: group-3-candidate-dosage
            pattern: "adds only three closed candidate-status|assigns general ALLOW|keeps every source-native homeopathic|keeps uncertain clinical|binds the exact safety hash|rejects a malformed expected safety-gate|preserves red-flag escalation ahead of stale safety|preserves mandatory medication review ahead of dosage-rule|adds only three closed dosage-rule|binds exactly one released rule|binds the exact candidate hash|rejects a malformed expected candidate-status|blocks rule assessment|fails closed when a released dosage"
          - name: group-4-audit-envelope
            pattern: "adds only one closed audit-envelope|materializes a deterministic inactive audit|binds fact, comparator|binds the exact dosage result|preserves red-flag escalation ahead of a stale audit|preserves medication review ahead of a stale audit"
          - name: group-5-audit-persistence
            pattern: "append-only.*audit.*table|persists.*exact|stale.*audit.*expectations|direct.*audit-run|exact.*audit.*row|audit.*persistence.*owner-only|owner-only.*retrieval"
          - name: group-6-governance
            pattern: "retention-restore preflight|technical retention and restore|invalid or exceeded audit inventory|import role receives direct audit DML"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retrieval_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retrieval_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      THERAPY_RETRIEVAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/retrieval_contract
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run the synthetic retrieval contract
        run: >-
          npx vitest run src/test/therapy-retrieval-v2-preflight.test.ts
          -t "${{ matrix.pattern }}"
      - name: Rehearse an ephemeral synthetic dump and restore
        if: matrix.name == 'group-5-audit-persistence'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t postgres_containers < <(
            docker ps --filter "ancestor=postgres:17" --format "{{.ID}}"
          )
          test "${#postgres_containers[@]}" -eq 1
          container_id="${postgres_containers[0]}"

          contract_sql="SELECT jsonb_build_object(
            'wiki_snapshot_sha256', encode(sha256(convert_to(public.kb_export_wiki_snapshot()::text, 'UTF8')), 'hex'),
            'therapy_snapshot_v2_sha256', encode(sha256(convert_to(public.therapy_input_export_snapshot_v2(), 'UTF8')), 'hex'),
            'therapy_snapshot_v3_sha256', encode(sha256(convert_to(public.therapy_input_export_snapshot_v3(), 'UTF8')), 'hex'),
            'retention_restore_preflight_sha256', encode(sha256(convert_to(public.therapy_retrieval_v2_audit_retention_restore_preflight_v1(10000, 67108864)::text, 'UTF8')), 'hex')
          )::text;"
          readiness_sql="SELECT concat_ws(':',
            public.therapy_retrieval_v2_audit_retention_restore_preflight_v1(10000, 67108864) ->> 'status',
            public.therapy_retrieval_v2_audit_retention_restore_preflight_v1(10000, 67108864) ->> 'technical_readiness_complete'
          );"

          source_contract="$(docker exec "$container_id" psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --username postgres --dbname retrieval_contract --command "$contract_sql")"
          source_readiness="$(docker exec "$container_id" psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --username postgres --dbname retrieval_contract --command "$readiness_sql")"
          test "$source_readiness" = "AUDIT_RETENTION_RESTORE_TECHNICAL_PREFLIGHT_READY_INACTIVE:true"

          docker exec "$container_id" pg_dump --format custom --file /tmp/retrieval-contract.dump --username postgres --dbname retrieval_contract
          dump_bytes="$(docker exec "$container_id" stat --format %s /tmp/retrieval-contract.dump)"
          test "$dump_bytes" -gt 0
          test "$dump_bytes" -le 67108864

          docker exec "$container_id" createdb --template template0 --username postgres retrieval_restore
          docker exec "$container_id" pg_restore --exit-on-error --single-transaction --username postgres --dbname retrieval_restore /tmp/retrieval-contract.dump

          target_contract="$(docker exec "$container_id" psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --username postgres --dbname retrieval_restore --command "$contract_sql")"
          target_readiness="$(docker exec "$container_id" psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --username postgres --dbname retrieval_restore --command "$readiness_sql")"
          test "$target_readiness" = "$source_readiness"
          test "$target_contract" = "$source_contract"
      - name: Prepare bounded synthetic concurrency target
        if: matrix.name == 'group-5-audit-persistence'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t postgres_containers < <(
            docker ps --filter "ancestor=postgres:17" --format "{{.ID}}"
          )
          test "${#postgres_containers[@]}" -eq 1
          container_id="${postgres_containers[0]}"

          docker exec "$container_id" pg_dump --format custom --exclude-table-data=public.therapy_retrieval_audit_runs --file /tmp/retrieval-concurrency.dump --username postgres --dbname retrieval_contract
          dump_bytes="$(docker exec "$container_id" stat --format %s /tmp/retrieval-concurrency.dump)"
          test "$dump_bytes" -gt 0
          test "$dump_bytes" -le 67108864

          docker exec "$container_id" createdb --template template0 --username postgres retrieval_concurrency
          docker exec "$container_id" pg_restore --exit-on-error --single-transaction --username postgres --dbname retrieval_concurrency /tmp/retrieval-concurrency.dump
          empty_audit_inventory="$(docker exec "$container_id" psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --username postgres --dbname retrieval_concurrency --command "SELECT concat_ws(':', count(*)::text, public.therapy_retrieval_v2_invalid_audit_run_count_v1()::text) FROM public.therapy_retrieval_audit_runs;")"
          test "$empty_audit_inventory" = "0:0"
          docker exec "$container_id" createdb --template template0 --username postgres retrieval_failure_isolation
          docker exec "$container_id" pg_restore --exit-on-error --single-transaction --username postgres --dbname retrieval_failure_isolation /tmp/retrieval-concurrency.dump
          empty_failure_inventory="$(docker exec "$container_id" psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 --username postgres --dbname retrieval_failure_isolation --command "SELECT concat_ws(':', count(*)::text, public.therapy_retrieval_v2_invalid_audit_run_count_v1()::text) FROM public.therapy_retrieval_audit_runs;")"
          test "$empty_failure_inventory" = "0:0"
      - name: Verify bounded synthetic owner concurrency
        if: matrix.name == 'group-5-audit-persistence'
        run: node scripts/verify-therapy-retrieval-postgres-concurrency.mjs
      - name: Verify bounded synthetic owner failure isolation
        if: matrix.name == 'group-5-audit-persistence'
        run: node scripts/verify-therapy-retrieval-postgres-failure-isolation.mjs
