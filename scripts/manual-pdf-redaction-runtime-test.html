<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetische Nachschwärzungsprüfung</title>
<body><h1>Lokale synthetische Nachschwärzungsprüfung</h1><p>Nur künstliche Flächen. Keine Patientenunterlagen und kein Cloudaufruf.</p><button id="start">Synthetische Seite prüfen</button><pre id="result"></pre><div id="review-root"></div>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {PdfArchiveReviewDialog} from '/src/components/admin/therapy/PdfArchiveReviewDialog.tsx';
import {requestPdfPagePrivacyReview} from '/src/lib/pdfPagePrivacyReview.ts';
import {applyManualPdfRedactions} from '/src/lib/manualPdfRedaction.ts';
import '/src/index.css';
createRoot(document.getElementById('review-root')).render(React.createElement(PdfArchiveReviewDialog,{scopeKey:'synthetic-only'}));
const unchangedTest=new URLSearchParams(location.search).get('unchanged')==='1';
window.manualRedactionTest={status:'ready',syntheticOnly:true};
document.getElementById('start').onclick=async()=>{
  const canvas=document.createElement('canvas');canvas.width=400;canvas.height=200;
  const context=canvas.getContext('2d',{alpha:false});context.fillStyle='white';context.fillRect(0,0,400,200);
  context.fillStyle='#f00';context.fillRect(50,50,100,20);context.fillStyle='#0a0';context.fillRect(50,78,180,20);
  const before=context.getImageData(0,0,400,200).data;
  window.manualRedactionTest={status:'reviewing',syntheticOnly:true};
  try{
    const image=new Blob([Uint8Array.from(atob(canvas.toDataURL('image/png').split(',')[1]),c=>c.charCodeAt(0))],{type:'image/png'});
    const rectangles=await requestPdfPagePrivacyReview({image,page:1,totalPages:1,reason:'Künstlicher Test: roten Bereich schwärzen, grünen Nachbarbereich erhalten.',manualRedaction:{width:400,height:200}});
    if(rectangles.length)applyManualPdfRedactions(context,rectangles,400,200);
    const after=context.getImageData(0,0,400,200).data;
    let outsideChanged=0,maskNotOpaqueBlack=0;
    for(let y=0;y<200;y++)for(let x=0;x<400;x++){
      const index=(y*400+x)*4,inside=rectangles.some(r=>x>=r.x&&x<r.x+r.width&&y>=r.y&&y<r.y+r.height);
      if(inside){if(after[index]||after[index+1]||after[index+2]||after[index+3]!==255)maskNotOpaqueBlack++;}
      else if([0,1,2,3].some(c=>before[index+c]!==after[index+c]))outsideChanged++;
    }
    const target=(60*400+80)*4,neighbour=(85*400+80)*4;
    const targetRemoved=after[target]===0&&after[target+1]===0&&after[target+2]===0;
    const neighbourPreserved=after[neighbour]===before[neighbour]&&after[neighbour+1]===before[neighbour+1]&&after[neighbour+2]===before[neighbour+2];
    window.manualRedactionTest={status:'completed',syntheticOnly:true,unchangedTest,rectangles,outsideChanged,maskNotOpaqueBlack,targetRemoved,neighbourPreserved,passed:outsideChanged===0&&maskNotOpaqueBlack===0&&neighbourPreserved&&(unchangedTest?rectangles.length===0&&!targetRemoved:targetRemoved)};
  }catch(error){window.manualRedactionTest={status:'failed',syntheticOnly:true,error:error.message};}
  document.getElementById('result').textContent=JSON.stringify(window.manualRedactionTest,null,2);
};
</script></body></html>
